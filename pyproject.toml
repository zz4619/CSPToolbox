[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csptoolbox"
version = "0.2.0.dev0"
description = "Utilities for crystal structure prediction workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ase",
  "matplotlib",
  "networkx",
  "numpy",
  "pymatgen",
  "rdkit",
  "scipy",
  "spglib",
]

[project.optional-dependencies]
ccdc = []
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
csp-cluster-pdd = "Source.CLI_scripts.cluster_pdd:main"
csp-write-expanded-cifs = "Source.CLI_scripts.write_expanded_cifs:main"
csp-vasp-cif-inputs = "Source.CLI_scripts.generate_vasp_inputs_from_cif_priority:main"
csp-vasp-pbe0-inputs = "Source.CLI_scripts.generate_pbe0_vasp_inputs_from_latest_contcar:main"
csp-vasp-summary = "Source.CLI_scripts.summarize_vasp_results:main"
csp-vasp-manifest = "Source.CLI_scripts.vasp_file_manifest:main"
csp-zmat-viewer = "Source.CLI_scripts.zmatrix_viewer:main"
csp-view = "Source.CLI_scripts.zmatrix_viewer:main"
csp-rdkit-conformers = "Source.CLI_scripts.generate_rdkit_conformers:main"
csp-cp2-local-min = "Source.CLI_scripts.prepare_cp2_local_min:main"
csp-cp2-local-min-batch = "Source.CLI_scripts.prepare_cp2_local_min_batch:main"

[tool.setuptools.packages.find]
include = ["Source", "Source.*", "csptoolbox", "csptoolbox.*"]

[tool.setuptools.package-data]
"Source.zmatrix_viewer" = ["assets/*.html", "assets/*.css", "assets/*.js"]

# One command runs every suite: `python -m pytest`.
# Full-dataset regressions are marked `slow` and run with `python -m pytest -m slow`.
[tool.pytest.ini_options]
testpaths = ["TestCase"]
python_files = ["test_*.py"]
pythonpath = [".", "TestCase"]
addopts = "-ra -m 'not slow'"
markers = [
  "slow: full-dataset regressions over T1/T2 (minutes); run with -m slow",
]
filterwarnings = [
  "ignore::DeprecationWarning:spglib.*",
]

# Lint for real defects only (syntax errors and pyflakes). Formatting is not
# enforced, so existing files are not churned; see docs/MAINTENANCE.md.
[tool.ruff]
target-version = "py310"
extend-exclude = ["MACE-Multipoles", "Codex_workspace", "build"]

[tool.ruff.lint]
select = ["E9", "F"]
